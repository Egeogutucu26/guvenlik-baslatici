name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.10", "3.12", "3.14"]
    steps:
      # SHA'lar refs/tags/v4 ve refs/tags/v5 için git ls-remote ile çözüldü.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        shell: bash
        run: python -m pip install -e ".[dev]"
      - name: Lint
        shell: bash
        run: python -m ruff check .
      - name: Test
        shell: bash
        run: python -m pytest -q
      - name: Build sdist and wheel
        shell: bash
        run: python -m build --sdist --wheel
      - name: Clean wheel smoke test
        shell: bash
        run: |
          WHEEL="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          python - "$WHEEL" <<'PY'
          import glob
          import json
          import os
          import subprocess
          import sys
          import tempfile
          import venv

          wheel = os.path.abspath(sys.argv[1])
          environment = tempfile.mkdtemp(prefix="guvenlik-baslatici-wheel-")
          venv.EnvBuilder(with_pip=True, clear=True).create(environment)
          scripts = os.path.join(environment, "Scripts" if os.name == "nt" else "bin")
          python_name = "python.exe" if os.name == "nt" else "python"
          python = os.path.join(scripts, python_name)
          subprocess.run([python, "-m", "pip", "install", "--no-deps", wheel], check=True)

          candidates = glob.glob(os.path.join(scripts, "guvenlik-baslatici*"))
          if os.name == "nt":
              candidates = [path for path in candidates if path.lower().endswith(".exe")]
          else:
              candidates = [path for path in candidates if os.access(path, os.X_OK)]
          if not candidates:
              raise RuntimeError("wheel console script bulunamadı")
          cli = candidates[0]

          result = subprocess.run(
              [cli, "list", "--json"], check=True, capture_output=True, text=True
          )
          json.loads(result.stdout)
          subprocess.run([python, "-m", "guvenlik_baslatici", "--version"], check=True)
          PY
